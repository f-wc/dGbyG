[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dGbyG"
dynamic = ["version"]
description = "dGbyG"
authors = [
    {name = "Fan Wenchao", email = "12133024@mail.sustech.edu.cn"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.3.2",
    "pandas>=2.3.2",
    "cobra>=0.29.1",
    "tqdm>=4.67.1",
    "rdkit>=2025.03.6",
    "torch>=2.8.0",
    "torch-geometric>=2.6.1",
    "biopython>=1.85",
    "pubchempy>=1.0.5",
    "JPype1>=1.6.0",
    "portalocker>=3.2.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/f-wc/dGbyG"

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"]}}

[tool.setuptools.dynamic]
version = {attr = "dGbyG.__version__"}